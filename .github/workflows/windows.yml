name: Windows verification
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14'
          architecture: x64
      - name: Install hash-locked dependencies
        run: 'python -m pip install --require-hashes --only-binary=:all: -r requirements-win.lock'
      - name: Verify source and processing
        run: python scripts/verify.py
      - name: Native Tk tests
        env:
          TARJA_GUI_TESTS: '1'
        run: python -m unittest test_interface test_manual_interface -v
      - name: Build allowlisted release
        run: python scripts/build_release.py
      - name: Verify Windows installer and desktop shortcut
        shell: powershell
        run: .\scripts\test_installer.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: windows-release
          path: dist/*
          if-no-files-found: error
